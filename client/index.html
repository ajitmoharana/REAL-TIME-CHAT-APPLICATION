<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Chat | WebSockets</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── Auth Section ────────────────────────────────────────── -->
<section id="authSection" class="auth-overlay">
  <div class="auth-card">
    <h1>💬 ChatApp</h1>
    <p class="tagline">Real-Time Messaging with WebSockets</p>

    <!-- Login Form -->
    <div id="loginForm">
      <h2>Login</h2>
      <input id="loginUsername" type="text"     placeholder="Username" />
      <input id="loginPassword" type="password" placeholder="Password" />
      <p id="loginError" class="form-error"></p>
      <button id="loginBtn" class="btn-primary">Login</button>
      <p class="switch-link">No account? <a id="showRegister">Register</a></p>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="hidden">
      <h2>Register</h2>
      <input id="regUsername" type="text"     placeholder="Username" />
      <input id="regEmail"    type="email"    placeholder="Email" />
      <input id="regPassword" type="password" placeholder="Password" />
      <p id="regError" class="form-error"></p>
      <button id="registerBtn" class="btn-primary">Register</button>
      <p class="switch-link">Have an account? <a id="showLogin">Login</a></p>
    </div>
  </div>
</section>

<!-- ── Chat Section ─────────────────────────────────────────── -->
<section id="chatSection" class="hidden chat-layout">

  <!-- Sidebar: User List -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span id="currentUser" class="me-label">Me</span>
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>
    <h3>Contacts</h3>
    <div id="userList" class="user-list"></div>
  </aside>

  <!-- Main Chat Area -->
  <main class="chat-main">
    <div id="chatHeader" class="chat-header hidden">
      <h3 id="chatWith">Select a user</h3>
      <span id="typingIndicator" class="typing-indicator"></span>
    </div>

    <div id="messagesDiv" class="messages-area">
      <p class="placeholder">← Select a contact to start chatting</p>
    </div>

    <div class="message-input-row">
      <input id="messageInput" type="text" placeholder="Type a message…" disabled />
      <button id="sendBtn" class="btn-send" disabled>Send ➤</button>
    </div>
  </main>

</section>

<!-- Toast container appended by JS -->
<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>
</body>
</html>
